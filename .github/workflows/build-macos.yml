          fi

      - name: Build macOS DMG (x64)
        working-directory: rdprep-mac
        run: npx electron-builder --mac --config electron-builder-mac.json --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

