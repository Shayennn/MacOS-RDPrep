            ### Source
            - Original: `${{ needs.unpack.outputs.url }}`
            - Built on: `macos-latest` targeting x64 via GitHub Actions
            - Electron: 22.3.27
          files: |
            rdprep-mac/release/*.dmg
            rdprep-mac/release/*.zip
            rdprep-screenshot-x64.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
