name: Build macOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      download_url:
        description: 'URL to RDPrep Windows installer (.exe)'
        required: false
        default: 'https://rdserverdoc.rd.go.th/prog_download/RDPrep_1.3.2_win_x64.exe'
      version:
        description: 'Version tag (e.g. 1.3.2)'
        required: false
        default: '1.3.2'

env:
  DEFAULT_DOWNLOAD_URL: 'https://rdserverdoc.rd.go.th/prog_download/RDPrep_1.3.2_win_x64.exe'

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unpack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.config.outputs.version }}
      url: ${{ steps.config.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine download URL and version
        id: config
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            URL="${{ github.event.inputs.download_url }}"
            VER="${{ github.event.inputs.version }}"
          else
            URL="$DEFAULT_DOWNLOAD_URL"
            VER=$(echo "$URL" | grep -oP 'RDPrep_\K[0-9]+\.[0-9]+\.[0-9]+' || echo "1.3.2")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Download URL: $URL"
          echo "Version: $VER"

      - name: Install 7z
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Download RDPrep installer
        run: |
          curl -L -o RDPrep.exe "${{ steps.config.outputs.url }}"
          ls -lh RDPrep.exe

      - name: Unpack NSIS → Electron app
        run: |
          TMPDIR=$(mktemp -d)

          7z x -o"$TMPDIR/nsis" RDPrep.exe -y > /dev/null

          APP_7Z=$(find "$TMPDIR/nsis" -name 'app-*.7z' -type f | head -1)
          if [[ -z "$APP_7Z" ]]; then
            echo "ERROR: app-*.7z not found"
            find "$TMPDIR/nsis" -type f | head -20
            exit 1
          fi

          7z x -o"$TMPDIR/app" "$APP_7Z" -y > /dev/null

          if [[ ! -d "$TMPDIR/app/resources/app" ]]; then
            echo "ERROR: resources/app/ not found"
            exit 1
          fi

          PROJECT_DIR="$GITHUB_WORKSPACE/rdprep-mac"
          mkdir -p "$PROJECT_DIR"
          cp -a "$TMPDIR/app/resources/app/." "$PROJECT_DIR/"

          if [[ -f "$TMPDIR/app/resources/elevate.exe" ]]; then
            cp "$TMPDIR/app/resources/elevate.exe" "$PROJECT_DIR/"
          fi

          LICENSE_FILE=$(find "$TMPDIR/nsis" -name "license.html" -type f | head -1)
          if [[ -n "$LICENSE_FILE" ]]; then
            mkdir -p "$PROJECT_DIR/build"
            cp "$LICENSE_FILE" "$PROJECT_DIR/build/License.html"
          fi

          rm -rf "$TMPDIR" RDPrep.exe

          echo "--- Project created ---"
          du -sh "$PROJECT_DIR"
          ls "$PROJECT_DIR/" | head -20

      - name: Beautify main.min.js → main.js
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/rdprep-mac"
          npm install -g js-beautify

          if [[ -f "$PROJECT_DIR/main.min.js" ]]; then
            VER="${{ steps.config.outputs.version }}"
            {
              echo "// Reconstructed from main.min.js (originally main.ts) - RDPrep v${VER}"
              echo "// This file was automatically de-minified from the production build."
              echo ""
              js-beautify --type js --indent-size 2 "$PROJECT_DIR/main.min.js"
            } > "$PROJECT_DIR/main.js"
            echo "Beautified main.js: $(wc -l < "$PROJECT_DIR/main.js") lines"
          else
            echo "WARNING: main.min.js not found"
          fi

      - name: Patch Electron 22 renderer compatibility
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/rdprep-mac"
          node -e '
            const fs = require("fs");
            const path = `${process.argv[1]}/main.js`;
            let source = fs.readFileSync(path, "utf8");

            source = source.replace(/nodeIntegration:\s*!0,(?!\s*\n\s*contextIsolation:)/g,
              "nodeIntegration: !0,\n\t\t\tcontextIsolation: !1,\n\t\t\tsandbox: !1,");

            fs.writeFileSync(path, source);
            console.log(`Patched ${path} for legacy renderer Node integration`);
          ' "$PROJECT_DIR"

      - name: Patch package.json for macOS
        run: |
          PROJECT_DIR="$GITHUB_WORKSPACE/rdprep-mac"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            pkg.main = "main.js";
            pkg.version = process.argv[2];
            pkg.scripts = pkg.scripts || {};
            pkg.scripts.start = "electron .";
            pkg.scripts["build:mac"] = "electron-builder --mac --config electron-builder-mac.json";
            pkg.dependencies = pkg.dependencies || {};
            pkg.dependencies.sqlite3 = "5.1.7";
            pkg.dependencies.bcrypt = "5.1.1";
            pkg.devDependencies = pkg.devDependencies || {};
            pkg.devDependencies.electron = "^22.3.27";
            pkg.devDependencies["electron-builder"] = "^24.13.3";
            fs.writeFileSync(process.argv[1], JSON.stringify(pkg, null, 2) + "\n");
          ' "$PROJECT_DIR/package.json" "${{ steps.config.outputs.version }}"

      - name: Upload unpacked project
        uses: actions/upload-artifact@v4
        with:
          name: rdprep-unpacked
          path: rdprep-mac/
          retention-days: 1

  build-arm64:
    needs: unpack
    runs-on: macos-latest
    steps:
      - name: Download unpacked project
        uses: actions/download-artifact@v4
        with:
          name: rdprep-unpacked
          path: rdprep-mac/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Write electron-builder config (arm64)
        run: |
          cat > rdprep-mac/electron-builder-mac.json <<'EOF'
          {
            "productName": "RDPrep",
            "appId": "rd.co.th.rd-efiling-app",
            "compression": "maximum",
            "artifactName": "RDPrep_${version}_${os}_${arch}.${ext}",
            "asar": false,
            "npmRebuild": false,
            "nodeGypRebuild": false,
            "buildDependenciesFromSource": false,
            "directories": { "output": "release/" },
            "afterPack": "scripts/after-pack.js",
            "publish": {
              "provider": "github",
              "owner": "Shayennn",
              "repo": "MacOS-RDPrep"
            },
            "files": [
              "**/*",
              "build/icon.*",
              "!main.js.map",
              "!main.min.js",
              "!**/*.js.map",
              "!**/*.ts",
              "!scripts/after-pack.js",
              "!elevate.exe"
            ],
            "mac": {
              "identity": null,
              "icon": "build/icon.icns",
              "target": [{ "target": "dmg", "arch": ["arm64"] }],
              "category": "public.app-category.finance",
              "hardenedRuntime": false,
              "gatekeeperAssess": false
            }
          }
          EOF
          node -e "
            const fs = require('fs');
            const f = process.argv[1];
            fs.writeFileSync(f, JSON.stringify(JSON.parse(fs.readFileSync(f,'utf8')), null, 2) + '\n');
          " rdprep-mac/electron-builder-mac.json

      - name: Write ad-hoc signing hook (arm64)
        run: |
          mkdir -p rdprep-mac/scripts
          cat > rdprep-mac/scripts/after-pack.js <<'EOF'
          const { execFileSync } = require('child_process');
          const path = require('path');

          exports.default = async function afterPack(context) {
            const appPath = path.join(
              context.appOutDir,
              `${context.packager.appInfo.productFilename}.app`
            );

            console.log(`Ad-hoc signing ${appPath}`);
            execFileSync('codesign', [
              '--force',
              '--deep',
              '--sign',
              '-',
              '--timestamp=none',
              appPath,
            ], { stdio: 'inherit' });

            execFileSync('codesign', [
              '--verify',
              '--deep',
              '--strict',
              '--verbose=2',
              appPath,
            ], { stdio: 'inherit' });
          };
          EOF

      - name: Install npm dependencies (arm64)
        working-directory: rdprep-mac
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install

          SQLITE_BINDING=$(find node_modules/sqlite3 -name node_sqlite3.node -print -quit 2>/dev/null || true)
          if [[ -z "$SQLITE_BINDING" ]]; then
            echo "Missing sqlite3 native binding"
            find node_modules/sqlite3 -name "*.node" -print 2>/dev/null || true
            exit 1
          fi
          SQLITE_ARCHS=$(lipo -archs "$SQLITE_BINDING" 2>/dev/null || true)
          echo "sqlite3 binding: $SQLITE_BINDING ($SQLITE_ARCHS)"
          if [[ "$SQLITE_ARCHS" != *"arm64"* ]]; then
            echo "sqlite3 binding is not arm64"
            exit 1
          fi

          BCRYPT_BINDING=$(find node_modules/bcrypt/lib/binding -name bcrypt_lib.node -print -quit 2>/dev/null || true)
          if [[ -z "$BCRYPT_BINDING" ]]; then
            echo "Missing bcrypt native binding"
            find node_modules/bcrypt/lib/binding -name "*.node" -print 2>/dev/null || true
            exit 1
          fi
          BCRYPT_ARCHS=$(lipo -archs "$BCRYPT_BINDING" 2>/dev/null || true)
          echo "bcrypt binding: $BCRYPT_BINDING ($BCRYPT_ARCHS)"
          if [[ "$BCRYPT_ARCHS" != *"arm64"* ]]; then
            echo "bcrypt binding is not arm64"
            exit 1
          fi

      - name: Build macOS DMG (arm64)
        working-directory: rdprep-mac
        run: npx electron-builder --mac --config electron-builder-mac.json --arm64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        run: find rdprep-mac/release -type f \( -name "*.dmg" -o -name "*.zip" \) -exec ls -lh {} \;

      - name: Launch app and capture screenshot
        run: |
          APP_PATH=$(find rdprep-mac/release/mac-arm64 -name "RDPrep.app" -type d | head -1)
          if [[ -z "$APP_PATH" ]]; then
            APP_PATH=$(find rdprep-mac/release -name "RDPrep.app" -type d | head -1)
          fi
          if [[ -z "$APP_PATH" ]]; then
            echo "RDPrep.app not found"
            exit 1
          fi

          echo "Verifying app signature..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH" 2>&1 | grep -E "Identifier=|Authority=|Signature=|TeamIdentifier=" || true
          spctl --assess --type execute --verbose=4 "$APP_PATH" || true

          SQLITE_BINDING=$(find "$APP_PATH/Contents/Resources/app/node_modules/sqlite3" -name node_sqlite3.node -print -quit 2>/dev/null || true)
          if [[ -z "$SQLITE_BINDING" ]]; then
            echo "Missing packaged sqlite3 native binding"
            find "$APP_PATH/Contents/Resources/app/node_modules/sqlite3" -name "*.node" -print 2>/dev/null || true
            exit 1
          fi
          SQLITE_ARCHS=$(lipo -archs "$SQLITE_BINDING" 2>/dev/null || true)
          echo "packaged sqlite3 binding: $SQLITE_BINDING ($SQLITE_ARCHS)"
          if [[ "$SQLITE_ARCHS" != *"arm64"* ]]; then
            echo "packaged sqlite3 binding is not arm64"
            exit 1
          fi

          BCRYPT_BINDING=$(find "$APP_PATH/Contents/Resources/app/node_modules/bcrypt/lib/binding" -name bcrypt_lib.node -print -quit 2>/dev/null || true)
          if [[ -z "$BCRYPT_BINDING" ]]; then
            echo "Missing packaged bcrypt native binding"
            find "$APP_PATH/Contents/Resources/app/node_modules/bcrypt/lib/binding" -name "*.node" -print 2>/dev/null || true
            exit 1
          fi
          BCRYPT_ARCHS=$(lipo -archs "$BCRYPT_BINDING" 2>/dev/null || true)
          echo "packaged bcrypt binding: $BCRYPT_BINDING ($BCRYPT_ARCHS)"
          if [[ "$BCRYPT_ARCHS" != *"arm64"* ]]; then
            echo "packaged bcrypt binding is not arm64"
            exit 1
          fi

          echo "Removing quarantine attributes..."
          sudo xattr -cr "$APP_PATH"

          echo "Launching RDPrep.app..."
          open "$APP_PATH"

          echo "Waiting 120s for app to render..."
          WINDOW_SEEN=false
          for i in $(seq 1 24); do
            sleep 5
            if [[ "$WINDOW_SEEN" == false ]] && osascript -e 'tell application "System Events" to get name of every window of process "RDPrep"' 2>/dev/null | grep -q .; then
              echo "Window detected after ${i}x5s"
              WINDOW_SEEN=true
            fi
            echo "  waited ${i}x5s"
          done

          echo "Capturing screenshot..."
          screencapture -x rdprep-screenshot-arm64.png

          echo "Closing app..."
          osascript -e 'tell application "RDPrep" to quit' 2>/dev/null || true
          sleep 2

          ls -lh rdprep-screenshot-arm64.png

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RDPrep-screenshot-arm64-${{ needs.unpack.outputs.version }}
          path: rdprep-screenshot-arm64.png
          retention-days: 30

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDPrep-macOS-arm64-${{ needs.unpack.outputs.version }}
          path: rdprep-mac/release/*.dmg
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.unpack.outputs.version }}-macos-arm64"
          name: "RDPrep ${{ needs.unpack.outputs.version }} (macOS Apple Silicon)"
          body: |
            ## RDPrep ${{ needs.unpack.outputs.version }} - macOS Apple Silicon (arm64)

            ### Installation
            1. Download the DMG below
            2. Open and drag RDPrep to Applications
            3. First launch: right-click → Open
            4. If macOS says the app is damaged, remove quarantine:
               `sudo xattr -dr com.apple.quarantine /Applications/RDPrep.app`

            This build is ad-hoc signed for integrity, but it is not Apple-notarized.

            ### Source
            - Original: `${{ needs.unpack.outputs.url }}`
            - Built on: `macos-latest` targeting arm64 via GitHub Actions
            - Electron: 22.3.27
          files: |
            rdprep-mac/release/*.dmg
            rdprep-mac/release/*.zip
            rdprep-screenshot-arm64.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-x64:
    needs: unpack
    runs-on: macos-latest
    steps:
      - name: Download unpacked project
        uses: actions/download-artifact@v4
        with:
          name: rdprep-unpacked
          path: rdprep-mac/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
