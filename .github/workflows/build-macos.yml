          retention-days: 30

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RDPrep-macOS-x64-${{ needs.unpack.outputs.version }}
          path: rdprep-mac/release/*.dmg
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.unpack.outputs.version }}-macos-x64"
          name: "RDPrep ${{ needs.unpack.outputs.version }} (macOS Intel)"
          body: |
            ## RDPrep ${{ needs.unpack.outputs.version }} - macOS Intel (x64)

            ### Installation
            1. Download the DMG below
            2. Open and drag RDPrep to Applications
            3. First launch: right-click → Open
            4. If macOS says the app is damaged, remove quarantine:
               `sudo xattr -dr com.apple.quarantine /Applications/RDPrep.app`

